# lbSmpCore-Auction — English Language File
# This file holds BOTH command names AND messages:
#   • Commands → used when commands.yml has "command-lang: en"
#   • Messages → used when config.yml has "lang: en"
#
# Sub-command format: [primary name, alias1, alias2, ...]
# First item is the main name, the rest are aliases. Edit freely.

main-command: auction
aliases: [ah, auction, ahh]

# Admin command — a SEPARATE command, independent from the main command.
admin-command: auctionadmin
admin-aliases: [ahadmin, adminpanel]

subcommands:
  sell: [sell, list, place]
  browse: [browse, ah, market]
  mylistings: [mylistings, mine, my]
  collect: [collect, claim, pick]
  remove: [remove, delete, del]
  reload: [reload, rld]   # yenile removed — admin only
  stats: [stats, stat, statistics]
  ban: [ban, block]
  search: [search, find]
  trade: [trade, swap]
  view: [view, inspect, player]

# /<main command> admin <name here> sub-commands
admin:
  stats: [stats, stat, statistics]
  logs: [logs, log, history]
  clear: [clear, wipe]
  remove: [remove, delete]
  ban: [ban, block]
  unban: [unban, pardon]
  banlist: [banlist, banned]
  inspect: [inspect, examine]
  gui: [gui, panel]
  reload: [yenile, reload, refresh]   # /ihaleadmin yenile | reload | refresh

# ═══════════════════════════════════════════════════════════
# MESSAGES  (config.yml → lang: en)
# MiniMessage format is supported (& color codes work too).
# Placeholders: %seller% %price% %item% %time_left% %amount% %player% %cmd% ...
# ═══════════════════════════════════════════════════════════
prefix: "<dark_gray><bold>[</bold></dark_gray><gradient:#7B2FBE:#C084FC><bold>ʟʙᴀᴜᴄᴛɪᴏɴʜᴏᴜꜱᴇ</bold></gradient><dark_gray><bold>]</bold></dark_gray>"

