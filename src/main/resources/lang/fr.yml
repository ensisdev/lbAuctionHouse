# lbSmpCore-Auction — Fichier de langue française
# Ce fichier contient à la fois les COMMANDES et les MESSAGES :
#   • Commandes → utilisées quand commands.yml a "command-lang: fr"
#   • Messages → utilisés quand config.yml a "lang: fr"
#
# Format des sous-commandes : [nom principal, alias1, alias2, ...]
# Le premier élément est le nom principal, les autres sont des alias. Modifiable librement.

main-command: auction
aliases: [ah, encheres, vente]

# Commande admin — commande DISTINCTE, indépendante de la commande principale.
admin-command: encheresadmin
admin-aliases: [ahadmin, administration]

subcommands:
  sell: [sell, vendre, list]
  browse: [browse, ouvrir, parcourir, ah]
  mylistings: [mylistings, mes, my]
  collect: [collect, recuperer, claim]
  remove: [remove, supprimer, delete]
  reload: [reload, recharger, rld]
  stats: [stats, statistiques]
  ban: [ban, bannir]
  search: [search, rechercher]
  trade: [trade, echange]
  view: [view, voir]

# /<commande principale> admin <nom ici> sous-commandes
admin:
  stats: [stats, statistiques]
  logs: [logs, historique, log]
  clear: [clear, vider]
  remove: [remove, supprimer]
  ban: [ban, bannir]
  unban: [unban, debannir]
  banlist: [banlist, bannis]

# ═══════════════════════════════════════════════════════════
# MESSAGES  (config.yml → lang: fr)
# Le format MiniMessage est pris en charge (les codes & aussi).
# Placeholders : %seller% %price% %item% %time_left% %amount% %player% %cmd% ...
# ═══════════════════════════════════════════════════════════
