      player-offline-no-uuid: "<red>Spieler nicht gefunden. Gib für Offline-Spieler eine UUID ein.</red>"
      unbanned: "<green>Die Sperre von %player% wurde aufgehoben.</green>"
      no-banned: "<green>Keine gesperrten Spieler.</green>"
      banned-list-header: "<gold>=== Gesperrte Spieler (%count%) ===</gold>"
  flash-sale:
    active: "<gold>⚡ ANGEBOT! %discount%% Rabatt!</gold>"
    ended: "<yellow>Dein Blitzangebot ist beendet: %item%</yellow>"
  wishlist:
    added: "<green>❤ <white>%item%</white> zur Wunschliste hinzugefügt!</green>"
