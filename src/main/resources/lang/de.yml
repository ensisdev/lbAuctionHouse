    invalid-number: "<red>Ungültige Zahl!</red>"
    invalid-uuid: "<red>Ungültige UUID!</red>"
    stats-header: "<gold>=== Auktionsstatistik ===</gold>"
    stats-line: "<gray>%label%:</gray> <white>%value%</white>"
