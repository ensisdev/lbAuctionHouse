# lbSmpCore-Auction — Deutsche Sprachdatei
# Diese Datei enthält sowohl BEFEHLE als auch NACHRICHTEN:
#   • Befehle  → verwendet, wenn commands.yml "command-lang: de" hat
#   • Nachrichten → verwendet, wenn config.yml "lang: de" hat
#
# Sub-Befehl-Format: [Hauptname, Alias1, Alias2, ...]
# Erster Eintrag ist der Hauptname, der Rest sind Aliase. Frei bearbeitbar.

main-command: auction
aliases: [ah, versteigerung, auktion]

# Admin-Befehl — EIGENSTÄNDIG, unabhängig vom Hauptbefehl.
admin-command: auktionsadmin
admin-aliases: [ahadmin, verwaltung]

subcommands:
  sell: [sell, verkaufen, list]
  browse: [browse, öffnen, durchsuchen, ah]
  mylistings: [mylistings, meine, my]
  collect: [collect, abholen, claim]
  remove: [remove, löschen, delete]
  reload: [reload, neuladen, rld]
  stats: [stats, statistik]
  ban: [ban, sperren]
  search: [search, suchen]
  trade: [trade, tausch]
  view: [view, ansehen]

# /<Hauptbefehl> admin <Name hier> Unterbefehle
admin:
  stats: [stats, statistik]
  logs: [logs, verlauf, log]
  clear: [clear, leeren]
  remove: [remove, löschen]
  ban: [ban, sperren]
  unban: [unban, entsperren]
  banlist: [banlist, gesperrte]

# ═══════════════════════════════════════════════════════════
# NACHRICHTEN  (config.yml → lang: de)
# MiniMessage-Format wird unterstützt (& Farbcodes auch).
# Platzhalter: %seller% %price% %item% %time_left% %amount% %player% %cmd% ...
# ═══════════════════════════════════════════════════════════
prefix: "<dark_gray>[</dark_gray><gold>Auktion</gold><dark_gray>]</dark_gray>"

auction:
  listing:
    success: "<green>Dein Gegenstand wurde für <white>%price%</white> eingestellt!</green>"
    failed-limit: "<red>Du hast das Listenlimit erreicht! Du kannst keine weiteren Gegenstände einstellen.</red>"
    failed-blacklist: "<red>Dieser Gegenstand kann nicht eingestellt werden!</red>"
    failed-price: "<red>Ungültiger Preis! (Min: %min% / Max: %max%)</red>"
    failed-economy: "<red>Das Wirtschaftssystem ist nicht verfügbar.</red>"
    failed-hand: "<red>Halte zuerst einen Gegenstand in der Hand!</red>"
    failed-number: "<red>Ungültiger Preis! Du musst eine Zahl eingeben.</red>"
    auto-renewed: "<gold>⏰ <white>%item%</white> wurde automatisch neu eingestellt!</gold>"
  purchase:
    success: "<green>Du hast <white>%item%</white> für <white>%price%</white> gekauft!</green>"
    sold-notification: "<green>Dein <white>%item%</white> wurde für <white>%price%</white> verkauft!</green>"
    insufficient-funds: "<red>Nicht genügend Guthaben!</red>"
    already-sold: "<red>Dieses Angebot existiert nicht mehr.</red>"
    cannot-buy-own: "<red>Du kannst dein eigenes Angebot nicht kaufen!</red>"
    error: "<red>Beim Kauf ist ein Fehler aufgetreten.</red>"
    inventory-full: "<red>Dein Inventar ist voll! Mach zuerst Platz.</red>"
  cancel:
    success: "<green>Angebot abgebrochen. Dein Gegenstand wurde zurückgegeben.</green>"
    failed: "<red>Das Angebot konnte nicht abgebrochen werden.</red>"
  bid:
    placed: "<gold>%player% hat %amount% auf dein Angebot geboten!</gold>"
    won: "<green>Du hast die Auktion gewonnen! Dein Gegenstand ist in der Abholbox.</green>"
    autobid-placed: "<green>🤖 Auto-Bid: <white>%amount%</white> geboten (max: %max%)</green>"
    outbid: "<yellow>Dein Gebot auf %player% wurde überboten! Neues Gebot: %amount%</yellow>"
    autobid-set: "<green>Auto-Bid aktiv: Maximum auf <white>%max%</white> gesetzt.</green>"
    autobid-removed: "<yellow>Auto-Bid abgebrochen.</yellow>"
    autobid-exists: "<red>Du hast bereits ein Auto-Bid!</red>"
  rental:
    returned: "<gold>Dein gemieteter Gegenstand wurde zurückgegeben: %item%</gold>"
  lootbox:
    not-configured: "<red>Lootbox ist nicht konfiguriert!</red>"
    result: "<gold>Du hast %item% aus der Lootbox erhalten!</gold>"
    error: "<red>Ungültige Lootbox-Konfiguration: %item%</red>"
  collection:
    empty: "<yellow>Du hast keine ausstehenden Belohnungen.</yellow>"
    notify-join: "<gold>Du hast <white>%count%</white> ausstehende Belohnungen! <white>/%command% collect</white></gold>"
    claimed: "<green>Gegenstand abgeholt!</green>"
    claimed-money: "<green>%amount% wurde auf dein Konto eingezahlt!</green>"
    inventory-full: "<red>Dein Inventar ist voll!</red>"
  sell:
    no-item: "<red>Lege zuerst den Gegenstand ab, den du verkaufen willst!</red>"
    blacklisted: "<red>Dieser Gegenstand kann nicht eingestellt werden!</red>"
    success: "<green>Dein Gegenstand wurde für <white>%price%</white> eingestellt!</green>"
    failed: "<red>Angebot konnte nicht veröffentlicht werden! (Limit / Fehler)</red>"
    invalid-number: "<red>Ungültige Zahl!</red>"
    min-price: "<red>Mindestpreis: %price%</red>"
    max-price: "<red>Höchstpreis: %price%</red>"
    advertised-success: "<gold>📢 Beworbenes Angebot veröffentlicht! Alle Spieler wurden benachrichtigt.</gold>"
    advertised-limit: "<red>Du hast das Werbelimit erreicht! (%max% aktive beworbene Angebote)</red>"
    advertised-fee: "<yellow>Werbegebühr abgezogen: %price%</yellow>"
  admin:
    header: "<gold>=== Admin-Panel ===</gold>"
    remove-usage: "<gray>/%cmd% admin remove <uuid></gray> <dark_gray>— Angebot entfernen</dark_gray>"
    clear-usage: "<gray>/%cmd% admin clear</gray> <dark_gray>— Alle Angebote löschen</dark_gray>"
    logs-usage: "<gray>/%cmd% admin logs</gray> <dark_gray>— Letzte Aktionen zeigen</dark_gray>"
    unknown: "<red>Unbekannter Unterbefehl: %arg%</red>"
    removed: "<green>Angebot entfernt. Der Gegenstand wurde in die Box des Verkäufers gelegt.</green>"
    cleared: "<green><white>%count%</white> Angebote gelöscht. Gegenstände wurden zurückgegeben.</green>"
    not-found: "<red>Angebot nicht gefunden.</red>"
    no-logs: "<red>Noch keine Aktionsprotokolle.</red>"
