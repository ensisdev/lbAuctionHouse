# lbSmpCore-Auction — Türkçe Dil Dosyası
# Bu dosya hem KOMUT isimlerini hem MESAJLARI içerir:
#   • Komutlar → commands.yml içindeki "command-lang: tr" seçilince kullanılır
#   • Mesajlar → config.yml içindeki "lang: tr" seçilince kullanılır
#
# Sub-command formatı: [birincil isim, alias1, alias2, ...]
# İlk öğe asıl ad, sonrakiler kısayoldur. İstediğinizi değiştirebilirsiniz.

main-command: ihale
aliases: [ah, auction, mezat]

# Yönetim komutu — ana komuttan BAĞIMSIZ ayrı komut.
admin-command: ihaleadmin
admin-aliases: [ahadmin, yonetim, yönetim]

subcommands:
  sell: [sat, list, sell]
  browse: [aç, ac, browse, listele]
  mylistings: [ilanlarim, ilanlarım, mylistings, my]
  collect: [kutu, collect, al, claim]
  remove: [sil, remove, delete]
  reload: [reload]   # yenile kaldırıldı — sadece /ihaleadmin altında
  stats: [stats, stat, istatistik]
  ban: [ban, yasak]
  search: [search, ara]
  trade: [trade, takas]
  view: [gör, gor, view]

# /<ana komut> admin <buradaki isim>  alt komutları
admin:
  stats: [stats, stat, istatistik]
  logs: [logs, geçmiş, log]
  clear: [clear, temizle]
  remove: [remove, sil]
  ban: [ban, yasak]
  unban: [unban, affet]
  banlist: [banlist, banliste, yasaklılar]
  inspect: [inspect, incele]
  gui: [gui, panel]
  reload: [yenile, reload, tazele]   # /ihaleadmin yenile | reload | tazele

# ═══════════════════════════════════════════════════════════
# MESAJLAR  (config.yml → lang: tr)
# MiniMessage formatı desteklenir (& kodları da çalışır).
# Placeholder'lar: %seller% %price% %item% %time_left% %amount% %player% %cmd% ...
# ═══════════════════════════════════════════════════════════
prefix: "<dark_gray><bold>[</bold></dark_gray><gradient:#7B2FBE:#C084FC><bold>ʟʙᴀᴜᴄᴛɪᴏɴʜᴏᴜꜱᴇ</bold></gradient><dark_gray><bold>]</bold></dark_gray>"

