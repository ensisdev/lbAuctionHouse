# ══════════════════════════════════════════════════════════════════
#  lbSmpCore-Auction — KOMUT AYARLARI  (commands.yml)
# ══════════════════════════════════════════════════════════════════
#  Bu dosya KOMUTLARI yönetir. Mesaj dili ayrıdır:
#    • Mesaj dili  → config.yml içindeki   "lang:"        alanı
#    • Komut dili  → bu dosyadaki           "command-lang:" alanı
#
#  Nasıl çalışır:
#   1) "command-lang: none" (varsayılan):
#        Dil dosyası kullanılmaz — TÜM komutlar bu dosyadan (commands.yml)
#        çekilir. Aşağıdaki değerler hazır Türkçe isimlerdir.
#   2) "command-lang: tr | en | de | fr | ar":
#        Komut isimleri o dilin dosyasından (lang/<dil>.yml) çekilir.
#        Yine de bu dosyada dolu olan bir alan, dil dosyasındaki değeri EZER.
#
#  Sub-command formatı:
#    [birincil isim, alias1, alias2, ...]
#    İlk öğe komutun ASIL adıdır (tab tamamlama ve yardımda görünür),
#    sonrakiler kısayollardır. Tümü yazılarak çalışır.
# ══════════════════════════════════════════════════════════════════

# none → tüm komutlar bu dosyadan çekilir.
# tr | en | de | fr | ar → komutlar lang/<dil>.yml dosyasından çekilir.
command-lang: none

# Ana komut adı (none modunda varsayılan: ihale).
main-command: ihale

# Ana komut aliasları (kısayolları).
aliases: [ah, auction, mezat]

# ══════════════════════════════════════════════════════════════════
#  YÖNETİM KOMUTU  —  ana komuttan BAĞIMSIZ ayrı bir komuttur.
#  Admin panelini doğrudan açar:
#    /ihaleadmin stats | logs | clear | remove <uuid> | ban | unban | banlist
#  Tab tamamlama bu komutta da çalışır.
#  ("/ihale yönet" gibi bir alt komut YOKTUR.)
# ══════════════════════════════════════════════════════════════════
admin-command: ihaleadmin
admin-aliases: [ahadmin, yonetim, yönetim]

# ──────────────────────────────────────────────────────────────────
#  SUB-COMMANDS  —  alt komutlar (Türkçe varsayılanlar)
#  Her satır:  [birincil isim, alias1, alias2, ...]
#  command-lang none iken bu değerler kullanılır; dil dosyasıyla
#  çalışırken dolu alan dil dosyasını ezer, boş alan ise
#  dil dosyasındaki değeri kullanır.
# ──────────────────────────────────────────────────────────────────
subcommands:
  sell: [sat, list, sell]
  browse: [aç, ac, browse, listele]
  mylistings: [ilanlarım, ilanlarim, mylistings, my]
  collect: [kutu, collect, al, claim]
  remove: [sil, remove, delete]
  reload: [yenile, reload]
  stats: [istatistik, stats, stat]
  ban: [yasak, ban]
  search: [ara, search]
  trade: [takas, trade]
  view: [gör, gor, view]

# ──────────────────────────────────────────────────────────────────
#  ADMIN ALT-KOMUTLARI  —  /<yönetim komutu> <buradaki isim>
#  Aynı mantık: ilk öğe asıl isim, sonrakiler alias.
# ──────────────────────────────────────────────────────────────────
admin:
  stats: [istatistik, stats, stat]
  logs: [geçmiş, logs, log]
  clear: [temizle, clear]
  remove: [sil, remove]
  ban: [yasak, ban]
  unban: [affet, unban]
  banlist: [yasaklılar, banlist, banliste]
  inspect: [inspect, incele]
