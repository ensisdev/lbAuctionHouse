# lbSmpCore-Auction Configuration
# All settings are configurable — no hardcoded values
# Bu Plugin "EnsisDev" Tarafından Aktif Olarak Geliştirilmektedir
config-version: 5

addon-display-name: "İhale"

# ───────────────────────────────────────────────
#  VERİ DEPOLAMA
#  • sqlite (varsayılan): tek sunucu, <pluginfolder>/data/database.db
#  • mysql: ÇAPRAZ SUNUCU — birden fazla sunucu aynı ilan havuzunu paylaşır.
#    Not: MySQL kullanınca diğer sunucularda değişikliklerin anında görünmesi
#    için cluster.mode 'redis' de açmanız önerilir.
# ───────────────────────────────────────────────
storage:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: lbsmpcore
    username: root
    password: ""
    pool-size: 10

# ════════════════════════════════════════════════════════════
#  MESAJ DİLİ — oyunculara gösterilen metinlerin dili.
#  tr | en | de | fr | ar   (lang/ klasöründeki dosyalar)
#  Örnek: "en" yazarsanız mesajlar lang/en.yml dosyasındaki
#  çevirilere göre gösterilir (eksik anahtarlar messages.yml'e düşer).
#
#  NOT: KOMUT isimleri buradan DEĞİL, commands.yml içindeki
#  "command-lang" alanından seçilir — ikisi bağımsızdır.
# ════════════════════════════════════════════════════════════
lang: tr

economy:
  # Economy type: vault (default), points or exp
  type: vault

auction:
  # Tax/commission rate (percentage, deducted from seller)
  tax-rate: 5.0

  # Sabit ilan ön ücreti — her listelemede kesilir (0 = ücretsiz)
  listing-fee: 0.0

  # Auto-extend: when a bid arrives within the last <threshold-seconds>,
  # extend the listing by <seconds> (like eBay style).
  auto-extend:
    seconds: 300
    threshold-seconds: 300

  # Min/Max listing price
  min-price: 1.0
  max-price: 1000000.0

  # Default listing duration in hours
  expire-hours: 48

  # Duration options for sell GUI (hours : price per hour)
  # Price is calculated as: duration_hours * price_per_hour
  # Set price_per_hour: 0 for free listings
  duration-options:
    1: 0.0
    6: 0.5
    12: 1.0
    24: 2.0
    48: 3.0
    72: 4.0

  # Max active listings per player (default, when no permission grants a higher limit)
  # Permission ile yükseltilebilir: lbauctionhouse.auctionlimit.<N>
  # Örnek: normal oyuncu 5, VIP oyuncuya lbauctionhouse.auctionlimit.10 verin → 10 ilan
  max-listings-per-player: 5

  # Whether to show a confirmation GUI before buying
  confirm-on-buy: true

  # Whether to notify players of unclaimed items on join
  notify-on-join: true

  # Whether seller must confirm/claim money manually after sale
  # false = money auto-deposits, true = goes to collection box
  confirm-money: true

  # Auto-renew: automatically re-list items when they expire
  # Set to 0 to disable
  auto-renew:
    max-times: 0

  # Rental settings (type: rent)
  rental:
    enabled: false
    max-duration-days: 30
    min-duration-days: 1
    price-per-day: 10.0

  # Lootbox settings
  lootbox:
    enabled: false
    price: 100.0
    items:
      DIAMOND: { weight: 5, amount: 1 }
      EMERALD: { weight: 15, amount: 3 }
      GOLD_INGOT: { weight: 30, amount: 5 }
      IRON_INGOT: { weight: 50, amount: 10 }
      DIRT: { weight: 50, amount: 16 }
      COBBLESTONE: { weight: 75, amount: 32 }

# Advertise (Reklam) settings
# Players can pay a fee to broadcast their listing to all online players
advertise:
  enabled: true
  # Fee charged when listing with advertise enabled
  fee: 500.0
  # Additional commission taken from sale price
  commission-percent: 10.0
  # Max concurrent advertised listings per player
  max-per-player: 3
  # Announce on list (action bar broadcast)
  announce-on-list: true
  # Broadcast interval for active advertised listings (seconds)
  broadcast-interval-seconds: 120
  # Action bar message shown to players (use {item}, {seller}, {price})
  actionbar-title: "&6📢 &e{item} &7- &6{seller} &7| &e{price}₺ &7- &6/{}ihale"
  # Permission required to SEE advertise broadcasts (empty = everyone)
  permission: ""

# Auto-Bid settings
# Players can set a max bid and the system bids for them automatically
auto-bid:
  enabled: true
  # Minimum increment for each automatic bid
  min-increment: 10.0

# Flash Sale settings
# Time-limited discounted listings with automatic price reduction
flash-sale:
  enabled: false
  # Discount percentage (1-99). Price is reduced by this amount.
  discount-percent: 20
  # How long the flash sale badge lasts (hours)
  duration-hours: 4
  # Max regular listing duration allowed for flash sale items (hours)
  max-listing-duration-hours: 24
  # Max concurrent flash sale listings per player
  max-per-player: 3

# Search settings
search:
  enabled: true

# ═══════════════════════════════════════════════════════════
#  PAZARLIK (Teklif / Negotiation) sistemi
#  Alıcı, "teklif açık" ilanlara pazarlık teklifi gönderir;
#  satıcı tıklanabilir [Kabul] [Reddet] [Yeni Teklif] ile yanıtlar.
# ═══════════════════════════════════════════════════════════
pazarlik:
  enabled: true
  # Alıcının teklifi, listedeki fiyatın en fazla bu yüzde altına inebilir.
  # 0 = sınırsız, 20 = en fazla %20 indirim, 100 = 1 birime kadar inebilir.
  max-discount-percent: 20
  # Aynı satıcıya kaç kez reddedilince gönderici bloklanır (cooldown başlar)
  reject-limit: 2
  # Blok süresi (saniye)
  cooldown-seconds: 300
  # Bekleyen teklifin yanıtlanmadan bozulmama süresi (saniye)
  timeout-seconds: 300
  # Bir oyuncunun aynı anda toplam bekleyen teklif sayısı üstü
  max-active-offers-per-player: 5

# Trade System (Oyuncu-oyuncu takas)
# Players can send trade requests to exchange items directly
trade:
  enabled: true
  # Time to accept a trade request (seconds)
  request-timeout-seconds: 30
  # Cooldown between trade requests (seconds)
  request-cooldown-seconds: 10
  # Max trade slots (items per player in trade menu)
  max-slots: 9
  # Require both players to confirm before swap
  require-confirm: true

# Statistics & Charts (Kişisel istatistik)
stats:
  enabled: true
  # Dashboard shows last N days of sales as a chart
  chart:
    enabled: true
    days: 30

# Cooldown & Anti-spam
# Prevents rapid command spam and duplicate actions
cooldown:
  enabled: true
  # Command cooldowns in seconds (per player)
  commands:
    sell: 2
    search: 3
    buy: 1
    bid: 1
    trade: 5
    harvest: 5
  # Anti-dupe guard interval (ms)
  anti-dupe:
    enabled: true
    # Minimum interval between identical item operations (ms)
    item-operation-ms: 500
  # Rate-limit for negotiation offers (ms) — aynı oyuncunun ardışık teklifleri arası minimum süre
  negotiation:
    offer-ms: 750

# Genel limitler
limits:
  # Bir bundle (paket) envanterine paketlenebilecek maksimum eşya sayısı
  bundle-items: 45
  # Oyuncu başına geçmiş (history) kaydında gösterilecek maksimum log sayısı
  history-logs: 200
  # Aynı komutun ardışık çağrıları arası minimum süre (ms) — 0 = devre dışı
  command-cooldown-ms: 500

# Sorting settings
sorting:
  enabled: true
  options:
    - "&#FFD54Fꜰɪʏᴀᴛ ↑"
    - "&#FFD54Fꜰɪʏᴀᴛ ↓"
    - "&#FFD54Fꜱᴜʀᴇ ↑"
    - "&#FFD54Fꜱᴜʀᴇ ↓"
    - "&#FFD54Fᴇɴ ʏᴇɴɪ"
    - "&#FFD54Fᴇɴ ᴇꜱᴋɪ"
    - "&#FFD54Fꜱᴀᴛɪᴄɪ ᴀ-ᴢ"
    - "&#FFD54Fꜱᴀᴛɪᴄɪ ᴢ-ᴀ"
    - "&#FFD54Fɪꜱɪᴍ ᴀ-ᴢ"
    - "&#FFD54Fɪꜱɪᴍ ᴢ-ᴀ"

# ───────────────────────────────────────────────
# Discord Webhook bildirimleri (opsiyonel)
# enabled: true yapın ve url kısmına Discord sunucunuzdaki
# kanalın webhook URL'sini yapıştırın (Kanal Ayarları → Entegrasyonlar → Webhook).
# Satış ve teklif bildirimleri bu kanala gönderilir.
# ───────────────────────────────────────────────
discord-webhook:
  enabled: false
  url: ""
  username: "lbAuctionHouse"

# Cluster / Cross-server settings
cluster:
  # Mode: local (single server) or redis (multi-server)
  mode: local
  redis:
    host: localhost
    port: 6379
    password: ""
    database: 0
    master: true

# Blacklisted items (cannot be listed)
blacklist:
  enabled: true
  materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - DEBUG_STICK
    - KNOWLEDGE_BOOK

# ───────────────────────────────────────────────
#  MATERIAL ADI ÇEVİRİLERİ (opsiyonel)
#  İlanlarda görünen eşya adlarını Türkçe (veya istediğiniz) adlarla gösterin.
#  Örnek:
#    ENCHANTING_TABLE: "Büyü Masası"
#    DIAMOND_SWORD: "Elmas Kılıç"
#  Boş bırakılırsa Paper'ın yerelleştirme anahtarı (oyuncu dili) kullanılır.
# ───────────────────────────────────────────────
material-names:
  ENCHANTING_TABLE: "Büyü Masası"
  enabled: true
  materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
