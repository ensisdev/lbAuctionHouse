# lbSmpCore-Auction — ملف اللغة العربية
# هذا الملف يحتوي على الأوامر والرسائل معًا:
#   • الأوامر → تُستخدم عندما يكون في commands.yml  "command-lang: ar"
#   • الرسائل → تُستخدم عندما يكون في config.yml  "lang: ar"
#
# صيغة الأوامر الفرعية: [الاسم الرئيسي، اسم مستعار1، اسم مستعار2، ...]
# أول عنصر هو الاسم الرئيسي، والباقي أسماء مستعارة. يمكن التعديل بحرية.
# ملاحظة: اللغة العربية من اليمين إلى اليسار (RTL).

main-command: auction
aliases: [ah, مزاد, بيع]

# أمر الإدارة — أمر مستقل منفصل عن الأمر الرئيسي.
admin-command: مزاد_الإدارة
admin-aliases: [ahadmin, إدارة]

subcommands:
  sell: [sell, بيع, list]
  browse: [browse, فتح, تصفح, ah]
  mylistings: [mylistings, قائمتي, my]
  collect: [collect, استلام, claim]
  remove: [remove, حذف, delete]
  reload: [reload, إعادة_تحميل, rld]
  stats: [stats, إحصائيات]
  ban: [ban, حظر]
  search: [search, بحث]
  trade: [trade, تبادل]
  view: [view, عرض]

# أوامر  /<الأمر الرئيسي> admin <الاسم هنا>  الفرعية
admin:
  stats: [stats, إحصائيات]
  logs: [logs, السجل, log]
  clear: [clear, مسح]
  remove: [remove, حذف]
  ban: [ban, حظر]
  unban: [unban, فك_الحظر]
  banlist: [banlist, المحظورون]

# ═══════════════════════════════════════════════════════════
# الرسائل  (config.yml → lang: ar)
# يُدعم تنسيق MiniMessage (ورموز الألوان & أيضًا).
# العناصر النائبة: %seller% %price% %item% %time_left% %amount% %player% %cmd% ...
# ═══════════════════════════════════════════════════════════
prefix: "<dark_gray>[</dark_gray><gold>مزاد</gold><dark_gray>]</dark_gray>"

auction:
  listing:
    success: "<green>تم عرض غرضك للبيع بسعر <white>%price%</white>!</green>"
    failed-limit: "<red>وصلت إلى حد العروض! لا يمكنك عرض المزيد من الأغراض.</red>"
    failed-blacklist: "<red>لا يمكن عرض هذا الغرض!</red>"
    failed-price: "<red>سعر غير صالح! (الحد الأدنى: %min% / الأقصى: %max%)</red>"
    failed-economy: "<red>نظام الاقتصاد غير متاح.</red>"
    failed-hand: "<red>احمل غرضًا في يدك أولًا!</red>"
    failed-number: "<red>سعر غير صالح! يجب إدخال رقم.</red>"
    auto-renewed: "<gold>⏰ تم إعادة عرض <white>%item%</white> تلقائيًا!</gold>"
  purchase:
    success: "<green>اشتريت <white>%item%</white> مقابل <white>%price%</white>!</green>"
    sold-notification: "<green>تم بيع <white>%item%</white> الخاص بك مقابل <white>%price%</white>!</green>"
    insufficient-funds: "<red>رصيد غير كافٍ!</red>"
    already-sold: "<red>هذا العرض لم يعد موجودًا.</red>"
    cannot-buy-own: "<red>لا يمكنك شراء عرضك الخاص!</red>"
    error: "<red>حدث خطأ أثناء الشراء.</red>"
    inventory-full: "<red>مخزونك ممتلئ! أفرغ مساحة أولًا.</red>"
  cancel:
    success: "<green>تم إلغاء العرض. أُعيد غرضك إلى مخزونك.</green>"
    failed: "<red>تعذر إلغاء العرض.</red>"
  bid:
    placed: "<gold>قام %player% بالمزايدة على عرضك بمبلغ %amount%!</gold>"
    won: "<green>لقد ربحت المزاد! غرضك في صندوق الاستلام.</green>"
    autobid-placed: "<green>🤖 مزايدة تلقائية: <white>%amount%</white> (الحد الأقصى: %max%)</green>"
    outbid: "<yellow>تم تجاوز مزايدتك على %player%! المزايدة الجديدة: %amount%</yellow>"
    autobid-set: "<green>المزايدة التلقائية مفعّلة: تم ضبط الحد الأقصى على <white>%max%</white>.</green>"
    autobid-removed: "<yellow>تم إلغاء المزايدة التلقائية.</yellow>"
    autobid-exists: "<red>لديك بالفعل مزايدة تلقائية!</red>"
  rental:
    returned: "<gold>عاد الغرض المستأجر: %item%</gold>"
  lootbox:
    not-configured: "<red>لم يتم ضبط صندوق الغنائم!</red>"
    result: "<gold>حصلت على %item% من صندوق الغنائم!</gold>"
    error: "<red>إعداد صندوق الغنائم غير صالح: %item%</red>"
  collection:
    empty: "<yellow>لا توجد مكافآت بانتظارك.</yellow>"
    notify-join: "<gold>لديك <white>%count%</white> مكافآت بانتظارك! <white>/%command% collect</white></gold>"
    claimed: "<green>تم استلام الغرض!</green>"
    claimed-money: "<green>تم إيداع %amount% في حسابك!</green>"
    inventory-full: "<red>مخزونك ممتلئ!</red>"
  sell:
    no-item: "<red>ضع الغرض الذي تريد بيعه أولًا!</red>"
    blacklisted: "<red>لا يمكن عرض هذا الغرض!</red>"
    success: "<green>تم عرض غرضك للبيع بسعر <white>%price%</white>!</green>"
    failed: "<red>تعذر نشر العرض! (حد / خطأ)</red>"
    invalid-number: "<red>رقم غير صالح!</red>"
    min-price: "<red>الحد الأدنى للسعر: %price%</red>"
    max-price: "<red>الحد الأقصى للسعر: %price%</red>"
    advertised-success: "<gold>📢 تم نشر العرض المُعلن! تم إشعار جميع اللاعبين.</gold>"
    advertised-limit: "<red>وصلت إلى حد الإعلانات! (%max% عروض مُعلنة نشطة)</red>"
    advertised-fee: "<yellow>تم خصم رسوم الإعلان: %price%</yellow>"
  admin:
