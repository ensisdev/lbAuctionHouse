    line: "<gray>• %item% %price% • %seller%%advertised%</gray>"
  view:
    usage: "<red>الاستخدام:</red> <gray>/%cmd% view <لاعب></gray>"
    not-found: "<red>اللاعب غير موجود. أدخل الاسم الكامل للاعب أولًا.</red>"
    empty: "<yellow>لا توجد عروض نشطة لـ %seller%.</yellow>"
