    unknown: "<red>أمر فرعي غير معروف: %arg%</red>"
    removed: "<green>تمت إزالة العرض. أُعيد الغرض إلى صندوق البائع.</green>"
    cleared: "<green>تم مسح <white>%count%</white> عروض. أُعيدت الأغراض إلى صناديق البائعين.</green>"
    not-found: "<red>العرض غير موجود.</red>"
    no-logs: "<red>لا توجد سجلات إجراءات بعد.</red>"
    logs-header: "<gold>=== آخر %count% إجراءات ===</gold>"
    invalid-number: "<red>رقم غير صالح!</red>"
    invalid-uuid: "<red>معرّف UUID غير صالح!</red>"
    stats-header: "<gold>=== إحصائيات المزاد ===</gold>"
    stats-line: "<gray>%label%:</gray> <white>%value%</white>"
    stats-total-sales: "إجمالي المبيعات"
    stats-total-revenue: "إجمالي الإيرادات"
