    notify: "<gold>❤ <white>%item%</white> من قائمة رغباتك أصبح معروضًا الآن! <gray>(%price% - %seller%)</gray></gold>"
  search:
    usage: "<red>الاستخدام:</red> <gray>/%cmd% search <استعلام> [min:100] [max:500] [type:BIN] [seller:اسم] [mat:DIAMOND] [ads]</gray>"
